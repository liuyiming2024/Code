name: 数据库迁移

# 手动触发：Actions → 数据库迁移 → Run workflow
#
# 为什么用它：
#   Supabase SQL Editor 需要手动粘贴，长脚本容易截断、报错不好定位。
#   把 SQL 放进仓库版本化，这里一键执行，日志可回看、可重跑。
#
# 配置：仓库 Settings → Secrets → Actions 添加 SUPABASE_DB_URL。
# 连接串的取值记在私有库，不写在这里。

on:
  workflow_dispatch:
    inputs:
      script:
        description: '要执行的脚本'
        required: true
        default: 'cloud.sql'
        type: choice
        options:
          - cloud.sql

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 要把日志推回 diag 分支
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # ⚠ 不要加 continue-on-error。
      #   Chat 那边踩过：加了之后 psql 明明失败却显示 success，
      #   再用 outcome 去判定又判错 —— 双重掩盖，表一直没建起来，
      #   而界面上"执行 SQL → success"。失败的迁移必须看起来就是失败的。
      #   正确做法：正常失败，日志用 if: always() 回收。
      - name: 执行 SQL
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          # 去除首尾空白/换行：手动粘贴 Secret 时极易在末尾带上回车，
          # 会导致库名变成 "postgres\n" 而连不上。
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export DB_URL
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::未配置 SUPABASE_DB_URL，请先在仓库 Settings → Secrets 里添加"
            exit 1
          fi
          echo "连接串长度 ${#DB_URL}"

          FILE="code/supabase/${{ inputs.script }}"
          : > migrate-log.txt
          {
            echo "==================== $FILE ===================="
          } | tee -a migrate-log.txt
          if [ ! -f "$FILE" ]; then
            echo "::error::找不到 $FILE"
            exit 1
          fi
          # 输出全留档：失败时这才是唯一线索
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$FILE" 2>&1 | tee -a migrate-log.txt
          RC=${PIPESTATUS[0]}
          echo "psql 退出码 $RC" | tee -a migrate-log.txt

          # 认证失败是最常见也最容易被误读的一种失败：
          # 它看起来像"数据库挂了"，其实只是 Secret 里的密码不对。
          # 与其让人去猜，不如在这里直接说清楚该查什么。
          if [ "$RC" -ne 0 ] && grep -q "password authentication failed" migrate-log.txt; then
            echo "" | tee -a migrate-log.txt
            echo "::error::数据库密码认证失败 —— SUPABASE_DB_URL 里的密码不对" | tee -a migrate-log.txt
            echo "排查：本仓库的 Secret 必须与 Chat 仓库的 SUPABASE_DB_URL 完全一致" | tee -a migrate-log.txt
            echo "（同一个 Supabase 项目，两边用同一个连接串）" | tee -a migrate-log.txt
            echo "更新位置：Settings → Secrets and variables → Actions → SUPABASE_DB_URL" | tee -a migrate-log.txt
            echo "注意：私有库 凭据.md 里记的连接串已过时 —— 照抄它必然认证失败。" | tee -a migrate-log.txt
            echo "" | tee -a migrate-log.txt
            echo "⚠ 密码拿不到，也改不动，所以别在这个仓库里死磕：" | tee -a migrate-log.txt
            echo "   · Secret 只能写不能读 → 拿不到 Chat 在用的正确值，没法复制过来" | tee -a migrate-log.txt
            echo "   · Supabase 托管版 postgres 不是 superuser →" | tee -a migrate-log.txt
            echo "       create role ... superuser  /  alter role postgres  都 permission denied" | tee -a migrate-log.txt
            echo "     密码只能在 Supabase 控制台重置（Project Settings → Database）" | tee -a migrate-log.txt
            echo "" | tee -a migrate-log.txt
            echo "✅ 不用等密码：云盘建表已改由 Chat 仓库统一执行 ——" | tee -a migrate-log.txt
            echo "   liuyiming2024/Chat → Actions →「执行 Code 云盘建表」→ Run workflow" | tee -a migrate-log.txt
            echo "   那份用的是 Chat 的有效凭据，脚本与本仓库 cloud.sql 同一份且全幂等。" | tee -a migrate-log.txt
          fi
          exit $RC

      - name: 日志存为产物
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: migrate-log
          path: migrate-log.txt
          if-no-files-found: warn
          retention-days: 30

      # 日志除了存 artifact，也推回 diag 分支。
      # 为什么两个都做：artifact 下载在某些网络环境下取不到（遇到过 403），
      # 那时就完全看不到失败原因，只能盲改。分支里的文件用 API 一定能读。
      - name: 日志推回分支
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          git config user.name "db-migrate"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin diag 2>/dev/null || true
          git checkout -B diag
          mkdir -p .diag
          cp migrate-log.txt .diag/db-migrate.log 2>/dev/null || true
          {
            echo "===== 校验 ====="
            DB_URL="$(printf '%s' "${DB_URL:-}" | tr -d '\r\n')"
            if [ -n "$DB_URL" ]; then
              echo "连接串长度 ${#DB_URL}，前缀 ${DB_URL:0:12}"
              psql "$DB_URL" -tAc "select coalesce(string_agg(table_name,', '),'（无）') from information_schema.tables where table_schema='public' and table_name like 'code_%'" 2>&1 || echo "（查询失败）"
            else
              echo "未配置 SUPABASE_DB_URL"
            fi
          } > .diag/verify.txt 2>&1
          git add -f .diag || true
          git commit -m "db-migrate 日志 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "（无变化可提交）"
          git push -f origin diag || echo "（推送失败）"

      - name: 校验
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export DB_URL
          echo "--- Code 相关表 ---"
          psql "$DB_URL" -tAc "select coalesce(string_agg(table_name,', ' order by table_name),'（无）') from information_schema.tables where table_schema='public' and table_name like 'code_%'"
          echo "--- Code 相关函数 ---"
          psql "$DB_URL" -tAc "select coalesce(string_agg(routine_name,', ' order by routine_name),'（无）') from information_schema.routines where routine_schema='public' and routine_name like 'code_%'"
          echo "--- 账号表仍在（未被误删）---"
          psql "$DB_URL" -tAc "select count(*) from users"
