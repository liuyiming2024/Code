name: 数据库迁移（已迁至 Chat 仓库）

# ⚠ 迁移的实际执行地点是 **Chat 仓库** 的「执行 Code 云盘建表」。
#   本仓库这条留着只是备用校验，**不要再拿它建表**。
#
# 为什么挪走：
#   Code 与 Chat 连同一个 Supabase 项目，但两边各存了一份 SUPABASE_DB_URL。
#   Chat 那份有效，Code 这份当初照抄私有库 凭据.md 的旧值，密码已经不对。
#   而且 GitHub 的 Secret 只能写不能读 —— 拿不到 Chat 的正确值，
#   也就没法"复制一份过来"修好它。所以只能让执行走 Chat 那边。
#
# 因此：本条跑失败（报 password authentication failed）是**已知状态**，
# 不是数据库出问题。真要修，去 Settings → Secrets 更新 SUPABASE_DB_URL，
# 与 Chat 仓库的保持一致。

on:
  workflow_dispatch:
    inputs:
      script:
        description: '要执行的脚本'
        required: true
        default: 'cloud.sql'
        type: choice
        options:
          - cloud.sql

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 要把日志推回 diag 分支
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # ⚠ 不要加 continue-on-error。
      #   Chat 那边踩过：加了之后 psql 明明失败却显示 success，
      #   再用 outcome 去判定又判错 —— 双重掩盖，表一直没建起来，
      #   而界面上"执行 SQL → success"。失败的迁移必须看起来就是失败的。
      #   正确做法：正常失败，日志用 if: always() 回收。
      - name: 执行 SQL
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          # 去除首尾空白/换行：手动粘贴 Secret 时极易在末尾带上回车，
          # 会导致库名变成 "postgres\n" 而连不上。
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export DB_URL
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::未配置 SUPABASE_DB_URL，请先在仓库 Settings → Secrets 里添加"
            exit 1
          fi
          echo "连接串长度 ${#DB_URL}"

          FILE="code/supabase/${{ inputs.script }}"
          : > migrate-log.txt
          {
            echo "==================== $FILE ===================="
          } | tee -a migrate-log.txt
          if [ ! -f "$FILE" ]; then
            echo "::error::找不到 $FILE"
            exit 1
          fi
          # 输出全留档：失败时这才是唯一线索
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$FILE" 2>&1 | tee -a migrate-log.txt
          RC=${PIPESTATUS[0]}
          echo "psql 退出码 $RC" | tee -a migrate-log.txt

          # 认证失败是最常见也最容易被误读的一种失败：
          # 它看起来像"数据库挂了"，其实只是 Secret 里的密码不对。
          # 与其让人去猜，不如在这里直接说清楚该查什么。
          if [ "$RC" -ne 0 ] && grep -q "password authentication failed" migrate-log.txt; then
            echo "" | tee -a migrate-log.txt
            echo "::error::数据库密码认证失败 —— SUPABASE_DB_URL 里的密码不对" | tee -a migrate-log.txt
            echo "这是已知状态：Code 仓库的 Secret 当初照抄了私有库旧的凭据.md" | tee -a migrate-log.txt
            echo "建表请去 **Chat 仓库** → Actions → 执行 Code 云盘建表（那边凭据有效）" | tee -a migrate-log.txt
            echo "" | tee -a migrate-log.txt
            echo "若想把这条修好（可选）：Settings → Secrets and variables → Actions" | tee -a migrate-log.txt
            echo "→ SUPABASE_DB_URL → 填与 Chat 仓库完全一致的连接串" | tee -a migrate-log.txt
            echo "（GitHub 的 Secret 只能写不能读，所以只能由你手动从 Chat 那边复制过来）" | tee -a migrate-log.txt
          fi
          exit $RC

      - name: 日志存为产物
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: migrate-log
          path: migrate-log.txt
          if-no-files-found: warn
          retention-days: 30

      # 日志除了存 artifact，也推回 diag 分支。
      # 为什么两个都做：artifact 下载在某些网络环境下取不到（遇到过 403），
      # 那时就完全看不到失败原因，只能盲改。分支里的文件用 API 一定能读。
      - name: 日志推回分支
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          git config user.name "db-migrate"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin diag 2>/dev/null || true
          git checkout -B diag
          mkdir -p .diag
          cp migrate-log.txt .diag/db-migrate.log 2>/dev/null || true
          {
            echo "===== 校验 ====="
            DB_URL="$(printf '%s' "${DB_URL:-}" | tr -d '\r\n')"
            if [ -n "$DB_URL" ]; then
              echo "连接串长度 ${#DB_URL}，前缀 ${DB_URL:0:12}"
              psql "$DB_URL" -tAc "select coalesce(string_agg(table_name,', '),'（无）') from information_schema.tables where table_schema='public' and table_name like 'code_%'" 2>&1 || echo "（查询失败）"
            else
              echo "未配置 SUPABASE_DB_URL"
            fi
          } > .diag/verify.txt 2>&1
          git add -f .diag || true
          git commit -m "db-migrate 日志 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "（无变化可提交）"
          git push -f origin diag || echo "（推送失败）"

      - name: 校验
        if: always()
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export DB_URL
          echo "--- Code 相关表 ---"
          psql "$DB_URL" -tAc "select coalesce(string_agg(table_name,', ' order by table_name),'（无）') from information_schema.tables where table_schema='public' and table_name like 'code_%'"
          echo "--- Code 相关函数 ---"
          psql "$DB_URL" -tAc "select coalesce(string_agg(routine_name,', ' order by routine_name),'（无）') from information_schema.routines where routine_schema='public' and routine_name like 'code_%'"
          echo "--- 账号表仍在（未被误删）---"
          psql "$DB_URL" -tAc "select count(*) from users"
